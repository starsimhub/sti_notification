name: Deploy Quarto dashboard to GitHub Pages

# Manual-dispatch only for now, so it does not clobber the live React dashboard
# (deploy-dashboard.yml) while both exist. To switch over: retire that workflow,
# then add the push trigger below.
#   on:
#     push:
#       branches: [main]
#       paths: ['dashboard-quarto/**', 'results/scenarios.kavg.csv',
#               'results/scenarios_timeseries.parquet',
#               'results/slide4_diagnostic_performance.csv',
#               '.github/workflows/deploy-dashboard-quarto.yml']
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
        working-directory: dashboard-quarto
      - run: quarto render
        working-directory: dashboard-quarto
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-quarto/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
